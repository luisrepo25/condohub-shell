# Shell de CondoHub: SPA con rutas del lado del cliente (/callback, /residente...)
server {
    listen 80;
    root /usr/share/nginx/html;
    # El navegador debe revisar siempre si hay una versión nueva del service worker y del manifiesto.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}